# Managed Keycloak instance (VSHN AppCat) on APPUiO.
#
# Every value below is either a working default or a placeholder in <angle brackets>
# that has to be filled in. Field reference:
# https://docs.appcat.ch/vshn-managed/keycloak/
---
apiVersion: vshn.appcat.vshn.io/v1
kind: VSHNKeycloak
metadata:
  # Instance name. VSHN derives the instance namespace from it: vshn-keycloak-<name>.
  # That namespace is where the pods run and where you port-forward to.
  name: keycloak
  # Claim namespace. Must match the ArgoCD Application destination, and it is the
  # namespace the ConfigMap and Secret referenced below are read from.
  namespace: <your-namespace>
spec:
  parameters:

    monitoring:
      # VSHN will start repairing the keycloak when it is broken.
      # This email gets an early warning that you might react before it really breaks.
      # Make sure to also set it in postgresqlParameters
      email: your@mail.com

    # Number of Keycloak servers, 0 to 3.
    # If you want a service level, you must also set the serviceLevel: guaranteed
    instances: 1

    service:
      # Supported versions are "25" and "26".
      version: "26"

      # Public hostname. Leaving it empty deploys no ingress at all.
      # On APPUiO Cloud, point a CNAME at your zone endpoint (for example
      # cname.cloudscale-lpg-0.appuio.cloud); the certificate is then issued and
      # renewed automatically.
      fqdn: <keycloak.example.ch>

      # besteffort or guaranteed. guaranteed buys a VSHN SLA and is the
      # prerequisite for running more than one instance.
      # Make sure to also set it in postgresqlParameters
      serviceLevel: besteffort

      adminConsole:
        # Keeps the admin console off the public FQDN. It stays reachable through
        #   kubectl port-forward -n vshn-keycloak-keycloak svc/<instance>-keycloakx-http 8080:80
        # Anyone who should do that needs to be in security.allowedGroups below.
        private: true
        # Alternative to private: publish the admin console on its own hostname.
        # fqdn: <admin.keycloak.example.ch>

      # Realm configuration. Names a ConfigMap in this namespace. Each of its keys
      # becomes a file under /opt/keycloak/setup/project, and keycloak-config-cli
      # imports all of them on every start. Generated by config/kustomization.yaml.
      customConfigurationRef: keycloak-config

      # Sources for environment variables. Used both by Keycloak itself (KC_* settings)
      # and by the $(env:NAME:-default) placeholders inside the realm JSONs.
      # Later entries win, so the Secret can override a value from the ConfigMap.
      envFrom:
        - configMapRef:
            name: keycloak-env-config
        - secretRef:
            name: keycloak-env

      # The bundled PostgreSQL. It inherits the plan and instance count from this
      # claim unless overridden here.
      postgreSQLParameters:
        # If your cluster supports encrypted ssd disk. It is a keycloak, potentially with client secrets.
        # This is given on e.g., APPUiO
        encryption:
          enabled: true
        monitoring:
          # VSHN will start repairing the keycloak when it is broken.
          # This email gets an early warning that you might react before it really breaks.
          email: your@mail.com
        # 1 or 3. If you want the keycloak highly available, you should also set the postgres to highly available.
        instances: 1
        service:
          # Explicitly state the major postgres version you want.
          majorVersion: "18"
          pgSettings:
            # Forces a WAL segment every 5 minutes, so a restore never trails
            # reality by more than that even when write traffic is low.
            archive_timeout: "300"
          # besteffort or guaranteed. guaranteed buys a VSHN SLA.
          serviceLevel: besteffort

    size:
      # standard-2 (500m CPU, 2Gi RAM), standard-4 (1 CPU, 4Gi RAM), both 16Gi disk.
      # standard-8 exceeds the default APPUiO Cloud quota; ask VSHN before using it.
      plan: standard-2

    security:
      # Blocks deletion of the claim. Set to false first when tearing down on purpose.
      deletionProtection: true
      # Groups granted read access to the instance namespace. Without this nobody
      # can port-forward to the private admin console.
      allowedGroups:
        - <your-admin-group>
      # allowedUsers:
      #   - <username>

    tls:
      enabled: true
      authClients: true

    maintenance:
      # UTC. VSHN patches Keycloak and PostgreSQL inside this window, which implies
      # a restart. Pick a quiet hour.
      # For test instances, set it to wednesday at 09:00: Then you have the most time to fix the problem or pause the update
      # before the prod instance is updated.
      dayOfWeek: monday
      timeOfDay: "23:00:00"
      # Pins the Keycloak image and stops automatic upgrades. An escape hatch for
      # sitting out a bad release; you own patching for as long as it is set.
      # pinImageTag: "26.7.1"

    backup:
      # UTC, standard cron. Keep it clear of the maintenance window.
      schedule: "0 2 * * *"
      retention:
        keepDaily: 14

  # VSHN writes the admin credentials and connection details into this Secret.
  writeConnectionSecretToRef:
    name: keycloak-creds
